[project]
name = "toxic-commando-trainer"
version = "0.9.4"
description = "Trainer / cheat overlay for John Carpenter's Toxic Commando (offline)"
requires-python = ">=3.11"
authors = [{ name = "toxic-commando-modders" }]
dependencies = [
    "PySide6>=6.6.0",
    "pymem>=1.13.0",
    "pywin32>=306",
    "pydantic>=2.5.0",
    "keyboard>=0.13.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]